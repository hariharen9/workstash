<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Multi-stop Mesh / Radial Blend matching the exact WorkStash App Icon -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FE3CE" />
      <stop offset="35%" stop-color="#6EE7B7" />
      <stop offset="70%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <radialGradient id="violetGlow" cx="15%" cy="85%" r="75%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="1" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="20%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="60%" stop-color="#34D399" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="amberGlow" cx="85%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="1" />
      <stop offset="60%" stop-color="#FBBF24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0" />
    </radialGradient>

    <clipPath id="squircleClip">
      <rect x="36" y="36" width="440" height="440" rx="128" ry="128" />
    </clipPath>
  </defs>

  <!-- Outer Squircle with Layered Chromatic Gradients -->
  <g clip-path="url(#squircleClip)">
    <!-- Base Gradient -->
    <rect x="36" y="36" width="440" height="440" fill="url(#baseGrad)" />
    <!-- Violet Bottom-Left Bloom -->
    <rect x="36" y="36" width="440" height="440" fill="url(#violetGlow)" />
    <!-- Cyan Top-Left Light -->
    <rect x="36" y="36" width="440" height="440" fill="url(#cyanGlow)" />
    <!-- Amber Sunset Accent -->
    <rect x="36" y="36" width="440" height="440" fill="url(#amberGlow)" />
  </g>

  <!-- Inner Bento Center Void Block -->
  <rect x="184" y="184" width="144" height="144" rx="42" ry="42" fill="#070A10" />
</svg>