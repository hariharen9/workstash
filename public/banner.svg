<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Rich multi-colour base gradient (Matching the polished WorkStash logo) -->
    <linearGradient id="logoBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="18%" stop-color="#34D399"/>
      <stop offset="35%" stop-color="#A3E635"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="65%" stop-color="#FB923C"/>
      <stop offset="80%" stop-color="#F472B6"/>
      <stop offset="92%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Cyan / turquoise top-left bloom -->
    <radialGradient id="logoCyanGlow" cx="12%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="1"/>
      <stop offset="28%" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="58%" stop-color="#34D399" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <!-- Lime / green upper-middle bloom -->
    <radialGradient id="logoLimeGlow" cx="48%" cy="8%" r="58%">
      <stop offset="0%" stop-color="#BEF264" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#4ADE80" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#4ADE80" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm yellow / orange right-side bloom -->
    <radialGradient id="logoAmberGlow" cx="92%" cy="58%" r="70%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="1"/>
      <stop offset="38%" stop-color="#FB923C" stop-opacity="0.9"/>
      <stop offset="68%" stop-color="#F97316" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <!-- Pink / magenta lower-right bloom -->
    <radialGradient id="logoPinkGlow" cx="78%" cy="95%" r="65%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="1"/>
      <stop offset="38%" stop-color="#F472B6" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>

    <!-- Violet / indigo lower-left bloom -->
    <radialGradient id="logoVioletGlow" cx="8%" cy="88%" r="72%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="35%" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Blue accent between violet and cyan -->
    <radialGradient id="logoBlueGlow" cx="28%" cy="55%" r="58%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#60A5FA" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="bannerLogoSquircle">
      <rect x="0" y="0" width="80" height="80" rx="23" ry="23"/>
    </clipPath>

    <!-- Atmospheric Background Ambient Glows -->
    <radialGradient id="bgGlowTop" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#070A10" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bgGlowCyan" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#070A10" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridMatrix" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1" />
    </pattern>

    <!-- Card Borders -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <linearGradient id="cardFocusBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(167, 139, 250, 0.5)" />
      <stop offset="100%" stop-color="rgba(167, 139, 250, 0.1)" />
    </linearGradient>

    <linearGradient id="cardFireBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(251, 146, 60, 0.5)" />
      <stop offset="100%" stop-color="rgba(251, 146, 60, 0.1)" />
    </linearGradient>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, "Space Grotesk", "DM Sans", Inter, "Segoe UI", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- 1. Background Void -->
  <rect width="1600" height="900" fill="#070A10" />
  <rect width="1600" height="900" fill="url(#bgGlowTop)" />
  <rect width="1600" height="900" fill="url(#bgGlowCyan)" />
  <rect width="1600" height="900" fill="url(#gridMatrix)" />

  <!-- 2. Header & Logo Area -->
  <g transform="translate(800, 115)">
    <!-- Actual Polished WorkStash Logo -->
    <g transform="translate(-255, -44)">
      <g clip-path="url(#bannerLogoSquircle)">
        <rect width="80" height="80" fill="url(#logoBaseGrad)"/>
        <rect width="80" height="80" fill="url(#logoCyanGlow)"/>
        <rect width="80" height="80" fill="url(#logoLimeGlow)"/>
        <rect width="80" height="80" fill="url(#logoAmberGlow)"/>
        <rect width="80" height="80" fill="url(#logoPinkGlow)"/>
        <rect width="80" height="80" fill="url(#logoVioletGlow)"/>
        <rect width="80" height="80" fill="url(#logoBlueGlow)"/>
      </g>
      <!-- Center Void Cutout -->
      <rect x="26.5" y="26.5" width="27" height="27" rx="7.5" ry="7.5" fill="#070A10" />
    </g>

    <!-- App Title -->
    <text x="-155" y="16" class="font-title" font-size="52" font-weight="800" fill="#F1F4FA" letter-spacing="-0.03em">WorkStash</text>
    
    <!-- Version / Status Pill -->
    <g transform="translate(145, -14)">
      <rect width="76" height="28" rx="8" fill="rgba(167, 139, 250, 0.12)" stroke="rgba(167, 139, 250, 0.3)" />
      <text x="38" y="18" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#A78BFA">v1.0.0</text>
    </g>

    <!-- Subtitle Tagline -->
    <text x="0" y="65" text-anchor="middle" class="font-title" font-size="20" font-weight="500" fill="#9AA6BD" letter-spacing="-0.01em">
      The Spatial Task Workspace for Finite Cognitive Focus
    </text>
  </g>

  <!-- 3. Minimalist Realistic Bento Canvas Mockup -->
  <g transform="translate(180, 250)">
    <!-- Outer Workspace Container Frame -->
    <rect width="1240" height="490" rx="24" fill="#101622" fill-opacity="0.8" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

    <!-- Top Workspace Header Bar inside Mockup -->
    <g transform="translate(24, 20)">
      <!-- Left: Topology Tabs -->
      <g>
        <rect width="320" height="36" rx="10" fill="#171F2E" stroke="rgba(255, 255, 255, 0.06)" />
        <!-- Active Tab: All Blocks -->
        <rect x="3" y="3" width="92" height="30" rx="8" fill="#1E283A" stroke="rgba(255, 255, 255, 0.12)" />
        <text x="49" y="22" text-anchor="middle" class="font-title" font-size="12" font-weight="600" fill="#F1F4FA">All Blocks</text>
        <text x="145" y="22" text-anchor="middle" class="font-title" font-size="12" font-weight="500" fill="#5B6782">Solo Focus</text>
        <text x="235" y="22" text-anchor="middle" class="font-title" font-size="12" font-weight="500" fill="#5B6782">Urgent First</text>
      </g>

      <!-- Right: Capacity Gauge -->
      <g transform="translate(930, 0)">
        <rect width="260" height="36" rx="10" fill="#171F2E" stroke="rgba(255, 255, 255, 0.06)" />
        <text x="16" y="22" class="font-mono" font-size="11" font-weight="600" fill="#9AA6BD">CAPACITY</text>
        <!-- Mini Gauge Bar -->
        <rect x="82" y="14" width="105" height="8" rx="4" fill="#070A10" />
        <rect x="82" y="14" width="68" height="8" rx="4" fill="#A78BFA" />
        <text x="242" y="22" text-anchor="end" class="font-mono" font-size="11" font-weight="700" fill="#F1F4FA">16/24</text>
      </g>
    </g>

    <!-- Bento Grid Task Cards (4 Columns × 2 Rows on Canvas) -->
    <!-- CARD 1: 2x2 Focus Hub (Left) -->
    <g transform="translate(24, 76)">
      <rect width="580" height="390" rx="18" fill="#171F2E" stroke="url(#cardFocusBorder)" stroke-width="1.5" />
      
      <!-- Category Strip Indicator -->
      <rect x="0" y="24" width="4" height="40" rx="2" fill="#A78BFA" />

      <!-- Card Title & Done Button -->
      <g transform="translate(24, 28)">
        <text class="font-title" font-size="20" font-weight="700" fill="#F1F4FA" letter-spacing="-0.02em">
          Design Token Audit &amp; System Architecture
        </text>
        
        <!-- Done Button -->
        <g transform="translate(450, -4)">
          <rect width="76" height="28" rx="8" fill="#1E283A" stroke="rgba(255, 255, 255, 0.08)" />
          <text x="38" y="18" text-anchor="middle" class="font-title" font-size="12" font-weight="600" fill="#9AA6BD">✓ Done</text>
        </g>
      </g>

      <!-- Inner Tabs -->
      <g transform="translate(24, 76)">
        <rect width="210" height="30" rx="8" fill="#101622" stroke="rgba(255, 255, 255, 0.05)" />
        <rect x="2" y="2" width="50" height="26" rx="6" fill="#1E283A" />
        <text x="27" y="18" text-anchor="middle" class="font-title" font-size="11" font-weight="600" fill="#F1F4FA">Notes</text>
        <text x="80" y="18" text-anchor="middle" class="font-title" font-size="11" font-weight="500" fill="#5B6782">Tasks</text>
        <text x="132" y="18" text-anchor="middle" class="font-title" font-size="11" font-weight="500" fill="#5B6782">Timer</text>
        <text x="184" y="18" text-anchor="middle" class="font-title" font-size="11" font-weight="500" fill="#5B6782">Energy</text>
      </g>

      <!-- Split View inside 2x2: Markdown Note + Checklist -->
      <g transform="translate(24, 122)">
        <!-- Markdown Scratchpad -->
        <rect width="250" height="200" rx="12" fill="#101622" stroke="rgba(255, 255, 255, 0.04)" />
        <text x="14" y="28" class="font-mono" font-size="11" fill="#A78BFA">## Spec &amp; Decisions</text>
        <text x="14" y="52" class="font-mono" font-size="10.5" fill="#9AA6BD">• Extract HSL CSS tokens</text>
        <text x="14" y="74" class="font-mono" font-size="10.5" fill="#9AA6BD">• Dynamic dark/light modes</text>
        <text x="14" y="96" class="font-mono" font-size="10.5" fill="#9AA6BD">• Zero-runtime audio pack</text>
        <text x="14" y="118" class="font-mono" font-size="10.5" fill="#5B6782">// 100% local persistence</text>

        <!-- Subtasks Checklist -->
        <g transform="translate(266, 0)">
          <rect width="264" height="200" rx="12" fill="#101622" stroke="rgba(255, 255, 255, 0.04)" />
          
          <!-- Subtask Item 1 (Done) -->
          <g transform="translate(12, 16)">
            <rect width="16" height="16" rx="4" fill="#34D399" />
            <path d="M4 8 L7 11 L12 5" fill="none" stroke="#070A10" stroke-width="2" stroke-linecap="round" />
            <text x="26" y="13" class="font-title" font-size="12" fill="#5B6782" text-decoration="line-through">Map spatial layout matrix</text>
          </g>

          <!-- Subtask Item 2 (Done) -->
          <g transform="translate(12, 46)">
            <rect width="16" height="16" rx="4" fill="#34D399" />
            <path d="M4 8 L7 11 L12 5" fill="none" stroke="#070A10" stroke-width="2" stroke-linecap="round" />
            <text x="26" y="13" class="font-title" font-size="12" fill="#5B6782" text-decoration="line-through">Synthesize web audio tones</text>
          </g>

          <!-- Subtask Item 3 (Pending) -->
          <g transform="translate(12, 76)">
            <rect width="16" height="16" rx="4" fill="none" stroke="#5B6782" stroke-width="1.5" />
            <text x="26" y="13" class="font-title" font-size="12" fill="#F1F4FA">Add 8×5 Studio Command preset</text>
          </g>

          <!-- Subtask Item 4 (Pending) -->
          <g transform="translate(12, 106)">
            <rect width="16" height="16" rx="4" fill="none" stroke="#5B6782" stroke-width="1.5" />
            <text x="26" y="13" class="font-title" font-size="12" fill="#F1F4FA">Build live workspace timeline</text>
          </g>
        </g>
      </g>

      <!-- Bottom Card Metadata Tags & Timer -->
      <g transform="translate(24, 345)">
        <rect width="52" height="22" rx="6" fill="rgba(167, 139, 250, 0.15)" stroke="rgba(167, 139, 250, 0.3)" />
        <text x="26" y="15" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#A78BFA">FOCUS</text>

        <g transform="translate(60, 0)">
          <rect width="82" height="22" rx="6" fill="#101622" stroke="rgba(255, 255, 255, 0.06)" />
          <text x="41" y="15" text-anchor="middle" class="font-mono" font-size="9.5" fill="#9AA6BD">#deep-work</text>
        </g>

        <!-- Timer Badge on Right -->
        <g transform="translate(432, 0)">
          <rect width="98" height="22" rx="6" fill="rgba(167, 139, 250, 0.1)" stroke="rgba(167, 139, 250, 0.25)" />
          <circle cx="12" cy="11" r="3" fill="#A78BFA" />
          <text x="54" y="15" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#F1F4FA">25:00 ⏱</text>
        </g>
      </g>
    </g>

    <!-- CARD 2: Urgent Fire Strip 2x1 (Top Right) -->
    <g transform="translate(620, 76)">
      <rect width="596" height="185" rx="18" fill="#171F2E" stroke="url(#cardFireBorder)" stroke-width="1.5" />
      
      <rect x="0" y="24" width="4" height="36" rx="2" fill="#FB923C" />

      <g transform="translate(24, 28)">
        <text class="font-title" font-size="18" font-weight="700" fill="#F1F4FA" letter-spacing="-0.02em">
          Production Security Headers &amp; CORS
        </text>
        
        <!-- Category & Tag -->
        <g transform="translate(0, 36)">
          <rect width="52" height="20" rx="5" fill="rgba(251, 146, 60, 0.15)" stroke="rgba(251, 146, 60, 0.3)" />
          <text x="26" y="14" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#FB923C">URGENT</text>

          <g transform="translate(60, 0)">
            <rect width="68" height="20" rx="5" fill="#101622" stroke="rgba(255, 255, 255, 0.06)" />
            <text x="34" y="14" text-anchor="middle" class="font-mono" font-size="9" fill="#9AA6BD">#hotfix</text>
          </g>
        </g>

        <!-- Progress Checklist Line -->
        <g transform="translate(0, 82)">
          <rect width="548" height="38" rx="8" fill="#101622" stroke="rgba(255, 255, 255, 0.04)" />
          <rect x="12" y="11" width="16" height="16" rx="4" fill="#34D399" />
          <path d="M16 19 L19 22 L24 16" fill="none" stroke="#070A10" stroke-width="2" stroke-linecap="round" />
          <text x="38" y="24" class="font-title" font-size="12" fill="#5B6782" text-decoration="line-through">Verify Firestore multi-user isolation</text>
          <text x="536" y="24" text-anchor="end" class="font-mono" font-size="11" font-weight="600" fill="#34D399">1/2</text>
        </g>
      </g>
    </g>

    <!-- CARD 3 & 4: Quick Admin 1x1 & 2x1 Micro Blocks (Bottom Right) -->
    <!-- Card 3: Quick 1x1 Micro Button -->
    <g transform="translate(620, 281)">
      <rect width="288" height="185" rx="18" fill="#171F2E" stroke="url(#cardBorder)" stroke-width="1.5" />
      
      <rect x="0" y="24" width="4" height="30" rx="2" fill="#22D3EE" />

      <g transform="translate(24, 28)">
        <text class="font-title" font-size="16" font-weight="700" fill="#F1F4FA">
          Review PR #482
        </text>
        <text x="0" y="32" class="font-title" font-size="12" fill="#9AA6BD">
          Refactor state storage
        </text>

        <!-- Tap-to-Complete Button -->
        <g transform="translate(0, 72)">
          <rect width="240" height="42" rx="10" fill="#101622" stroke="rgba(34, 211, 238, 0.25)" />
          <text x="120" y="26" text-anchor="middle" class="font-title" font-size="12" font-weight="600" fill="#22D3EE">
            ✓ Tap to Complete
          </text>
        </g>
      </g>
    </g>

    <!-- Card 4: 1x1 Inbox Rapid Stash -->
    <g transform="translate(928, 281)">
      <rect width="288" height="185" rx="18" fill="#171F2E" stroke="url(#cardBorder)" stroke-width="1.5" />
      
      <g transform="translate(24, 28)">
        <div class="flex items-center gap-2">
          <text class="font-title" font-size="16" font-weight="700" fill="#F1F4FA">
            Off-Grid Inbox Dock
          </text>
        </div>
        <text x="0" y="32" class="font-title" font-size="12" fill="#9AA6BD">
          Zero-capacity holding pen
        </text>

        <!-- Stashed Pill -->
        <g transform="translate(0, 68)">
          <rect width="240" height="46" rx="10" fill="#101622" stroke="rgba(255, 255, 255, 0.06)" />
          <text x="14" y="22" class="font-title" font-size="11.5" fill="#F1F4FA">📥 Audit telemetry logs</text>
          <text x="14" y="38" class="font-mono" font-size="9.5" fill="#5B6782">Drag to grid when ready</text>
        </g>
      </g>
    </g>
  </g>

  <!-- 4. Bottom Feature Pillars Footer -->
  <g transform="translate(800, 810)">
    <g transform="translate(-460, 0)">
      <text class="font-title" font-size="13" font-weight="600" fill="#9AA6BD">🍱 Dynamic Bento Geometry</text>
    </g>
    <text x="-215" y="0" class="font-mono" font-size="12" fill="#5B6782">•</text>
    
    <g transform="translate(-185, 0)">
      <text class="font-title" font-size="13" font-weight="600" fill="#9AA6BD">📐 Finite Capacity Ceiling</text>
    </g>
    <text x="45" y="0" class="font-mono" font-size="12" fill="#5B6782">•</text>
    
    <g transform="translate(75, 0)">
      <text class="font-title" font-size="13" font-weight="600" fill="#9AA6BD">🔥 Ember Pomodoro</text>
    </g>
    <text x="260" y="0" class="font-mono" font-size="12" fill="#5B6782">•</text>
    
    <g transform="translate(290, 0)">
      <text class="font-title" font-size="13" font-weight="600" fill="#9AA6BD">🔒 100% Local &amp; Private</text>
    </g>
  </g>
</svg>
